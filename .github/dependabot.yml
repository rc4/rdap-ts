version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      production:
        dependency-type: 'production'
      development:
        dependency-type: 'development'
    cooldown:
      default-days: 14
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
