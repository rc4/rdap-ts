name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: pnpm/setup@v2
        with:
          version: ^11.0.0
          runtime: node@lts
          cache: true

      - name: Build
        run: pnpm build

  check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: |
          pnpm typecheck
          pnpm attw

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test
        run: pnpm rstest --coverage --coverage.reportOnFailure

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage
